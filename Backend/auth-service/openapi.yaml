openapi: 3.0.3
info:
  title: auth-service (commun)
  version: 0.1.0
  description: "Comptes, rôles et émission des JWT. Microservice commun développé par toute l'équipe."
servers:
  - url: "http://localhost:8081"
    description: "local (en production : via l'API Gateway sur 8080)"
security:
  - bearerAuth: []
paths:
  /api/auth/register:
    post:
      summary: Créer un compte
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Conflit avec l'état actuel"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/auth/login:
    post:
      summary: Se connecter et obtenir un JWT
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT émis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
      security: []
  /api/users/me:
    get:
      summary: "Profil de l'utilisateur connecté"
      tags:
        - users
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/users/{id}:
    get:
      summary: Consulter un utilisateur (ADMIN)
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Utilisateur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Droits insuffisants
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - fullName
        - role
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        fullName:
          type: string
        role:
          type: string
          enum:
            - ENTREPRENEUR
            - AGENCE
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    TokenResponse:
      type: object
      properties:
        token:
          type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        role:
          type: string
          enum:
            - ENTREPRENEUR
            - AGENCE
            - ADMIN
        createdAt:
          type: string
          format: date-time
