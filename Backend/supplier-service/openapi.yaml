openapi: 3.0.3
info:
  title: supplier-service
  version: 0.1.0
  description: "Fournisseurs et commandes d'achat (B2B). Publie l'événement OrderConfirmed. Montants DECIMAL(12,3) en dinars tunisiens."
servers:
  - url: "http://localhost:8086"
    description: "local (en production : via l'API Gateway sur 8080)"
security:
  - bearerAuth: []
paths:
  /api/suppliers:
    post:
      summary: Ajouter un fournisseur
      tags:
        - suppliers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupplierRequest"
      responses:
        "201":
          description: Fournisseur créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/suppliers/{id}:
    get:
      summary: Consulter un fournisseur
      tags:
        - suppliers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Fournisseur
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupplierResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/suppliers:
    get:
      summary: "Fournisseurs d'un projet, filtrables par catégorie"
      tags:
        - suppliers
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: category
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Liste des fournisseurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupplierResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/purchase-orders:
    post:
      summary: "Créer une commande d'achat"
      tags:
        - orders
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: Commande créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/purchase-orders/{id}:
    get:
      summary: Consulter une commande
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Commande
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/purchase-orders/{id}/status:
    patch:
      summary: "Changer le statut d'une commande (CONFIRMED publie OrderConfirmed)"
      tags:
        - orders
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusUpdate"
      responses:
        "200":
          description: Commande mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Conflit avec l'état actuel"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    SupplierRequest:
      type: object
      required:
        - projectId
        - name
      properties:
        projectId:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        contactEmail:
          type: string
          format: email
        phone:
          type: string
        notes:
          type: string
    SupplierResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        name:
          type: string
        category:
          type: string
        contactEmail:
          type: string
        phone:
          type: string
        notes:
          type: string
    OrderLineDto:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          example: 45.25
    OrderRequest:
      type: object
      required:
        - projectId
        - supplierId
        - lines
      properties:
        projectId:
          type: integer
          format: int64
        supplierId:
          type: integer
          format: int64
        orderDate:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineDto"
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        supplierId:
          type: integer
          format: int64
        orderNumber:
          type: string
        orderDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - DRAFT
            - CONFIRMED
            - DELIVERED
            - CANCELLED
        totalAmount:
          type: number
        lines:
          type: array
          items:
            $ref: "#/components/schemas/OrderLineDto"
    OrderStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - DRAFT
            - CONFIRMED
            - DELIVERED
            - CANCELLED
