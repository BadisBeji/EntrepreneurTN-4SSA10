openapi: 3.0.3
info:
  title: finance-service
  version: 0.1.0
  description: "Facturation, comptabilité simple et gestion du capital. Publie l'événement InvoiceIssued. Montants DECIMAL(12,3) en dinars tunisiens."
servers:
  - url: "http://localhost:8084"
    description: "local (en production : via l'API Gateway sur 8080)"
security:
  - bearerAuth: []
paths:
  /api/invoices:
    post:
      summary: Créer une facture
      tags:
        - invoices
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceRequest"
      responses:
        "201":
          description: Facture créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/invoices/{id}:
    get:
      summary: Consulter une facture
      tags:
        - invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Facture
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/invoices:
    get:
      summary: "Factures d'un projet, filtrables par statut"
      tags:
        - invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: "DRAFT, SENT, PAID, OVERDUE ou CANCELLED"
      responses:
        "200":
          description: Liste des factures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InvoiceResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/invoices/{id}/status:
    patch:
      summary: "Changer le statut d'une facture (SENT publie InvoiceIssued)"
      tags:
        - invoices
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvoiceStatusUpdate"
      responses:
        "200":
          description: Facture mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Conflit avec l'état actuel"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/transactions:
    post:
      summary: Enregistrer un revenu ou une dépense
      tags:
        - transactions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionRequest"
      responses:
        "201":
          description: Transaction créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/transactions:
    get:
      summary: "Transactions d'un projet sur une période"
      tags:
        - transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: from
          in: query
          required: false
          schema:
            type: string
          description: date de début (AAAA-MM-JJ)
        - name: to
          in: query
          required: false
          schema:
            type: string
          description: date de fin (AAAA-MM-JJ)
      responses:
        "200":
          description: Liste des transactions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TransactionResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/summary:
    get:
      summary: "Bilan d'un projet (revenus, dépenses, solde)"
      tags:
        - transactions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Bilan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SummaryResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/capital-contributions:
    post:
      summary: Enregistrer un apport au capital
      tags:
        - capital
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContributionRequest"
      responses:
        "201":
          description: Apport enregistré
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContributionResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/capital:
    get:
      summary: "Capital d'un projet et liste des apports"
      tags:
        - capital
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Capital
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapitalResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    InvoiceLineDto:
      type: object
      properties:
        description:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          example: 120.5
        vatRate:
          type: number
    InvoiceRequest:
      type: object
      required:
        - projectId
        - clientName
        - issueDate
        - lines
      properties:
        projectId:
          type: integer
          format: int64
        clientName:
          type: string
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineDto"
    InvoiceResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        number:
          type: string
        clientName:
          type: string
        issueDate:
          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - DRAFT
            - SENT
            - PAID
            - OVERDUE
            - CANCELLED
        totalAmount:
          type: number
        lines:
          type: array
          items:
            $ref: "#/components/schemas/InvoiceLineDto"
    InvoiceStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - DRAFT
            - SENT
            - PAID
            - OVERDUE
            - CANCELLED
    TransactionRequest:
      type: object
      required:
        - projectId
        - type
        - amount
        - date
      properties:
        projectId:
          type: integer
          format: int64
        type:
          type: string
          enum:
            - INCOME
            - EXPENSE
        category:
          type: string
        amount:
          type: number
          example: 1250.5
        date:
          type: string
          format: date
        description:
          type: string
    TransactionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        type:
          type: string
        category:
          type: string
        amount:
          type: number
        date:
          type: string
          format: date
        description:
          type: string
    SummaryResponse:
      type: object
      properties:
        totalIncome:
          type: number
        totalExpense:
          type: number
        balance:
          type: number
    ContributionRequest:
      type: object
      required:
        - projectId
        - contributorName
        - amount
        - contributionDate
        - kind
      properties:
        projectId:
          type: integer
          format: int64
        contributorName:
          type: string
        amount:
          type: number
        contributionDate:
          type: string
          format: date
        kind:
          type: string
          enum:
            - CASH
            - IN_KIND
    ContributionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        contributorName:
          type: string
        amount:
          type: number
        contributionDate:
          type: string
          format: date
        kind:
          type: string
    CapitalResponse:
      type: object
      properties:
        projectId:
          type: integer
          format: int64
        totalCapital:
          type: number
        contributions:
          type: array
          items:
            $ref: "#/components/schemas/ContributionResponse"
