openapi: 3.0.3
info:
  title: legal-service
  version: 0.1.0
  description: "Catalogue des démarches légales et administratives, documents requis et suivi par projet. Publie l'événement ProcedureCompleted."
servers:
  - url: "http://localhost:8083"
    description: "local (en production : via l'API Gateway sur 8080)"
security:
  - bearerAuth: []
paths:
  /api/procedures:
    get:
      summary: "Lister les démarches, filtrables par type de projet"
      tags:
        - procedures
      parameters:
        - name: projectType
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Liste des démarches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProcedureResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    post:
      summary: Ajouter une démarche au catalogue (ADMIN)
      tags:
        - procedures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcedureRequest"
      responses:
        "201":
          description: Démarche créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "403":
          description: Droits insuffisants
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Conflit avec l'état actuel"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/procedures/{id}:
    get:
      summary: Consulter une démarche et ses documents requis
      tags:
        - procedures
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Démarche
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcedureResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/trackings:
    post:
      summary: "Commencer le suivi d'une démarche pour un projet"
      tags:
        - trackings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingRequest"
      responses:
        "201":
          description: Suivi créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Conflit avec l'état actuel"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/trackings/{id}/status:
    patch:
      summary: "Changer le statut d'un suivi (COMPLETED publie ProcedureCompleted)"
      tags:
        - trackings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackingStatusUpdate"
      responses:
        "200":
          description: Suivi mis à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackingResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    DocumentDto:
      type: object
      properties:
        name:
          type: string
        mandatory:
          type: boolean
    ProcedureRequest:
      type: object
      required:
        - title
        - authority
        - projectType
      properties:
        title:
          type: string
        description:
          type: string
        authority:
          type: string
        projectType:
          type: string
        estimatedDays:
          type: integer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDto"
    ProcedureResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        description:
          type: string
        authority:
          type: string
        projectType:
          type: string
        estimatedDays:
          type: integer
        documents:
          type: array
          items:
            $ref: "#/components/schemas/DocumentDto"
    TrackingRequest:
      type: object
      required:
        - projectId
        - procedureId
      properties:
        projectId:
          type: integer
          format: int64
        procedureId:
          type: integer
          format: int64
    TrackingResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        procedureId:
          type: integer
          format: int64
        status:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
            - COMPLETED
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
    TrackingStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - NOT_STARTED
            - IN_PROGRESS
            - COMPLETED
