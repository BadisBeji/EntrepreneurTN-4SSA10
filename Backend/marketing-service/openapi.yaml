openapi: 3.0.3
info:
  title: marketing-service
  version: 0.1.0
  description: "Veille concurrentielle et campagnes marketing. Publie l'événement CampaignLaunched."
servers:
  - url: "http://localhost:8085"
    description: "local (en production : via l'API Gateway sur 8080)"
security:
  - bearerAuth: []
paths:
  /api/competitors:
    post:
      summary: Ajouter un concurrent à suivre
      tags:
        - competitors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompetitorRequest"
      responses:
        "201":
          description: Concurrent créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/competitors:
    get:
      summary: Concurrents suivis par un projet
      tags:
        - competitors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Liste des concurrents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompetitorResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/competitors/{id}/watch-entries:
    post:
      summary: Ajouter une observation de veille sur un concurrent
      tags:
        - watch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WatchEntryRequest"
      responses:
        "201":
          description: Observation créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WatchEntryResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
    get:
      summary: "Observations de veille d'un concurrent"
      tags:
        - watch
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Liste des observations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WatchEntryResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/campaigns:
    post:
      summary: Créer une campagne marketing
      tags:
        - campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
      responses:
        "201":
          description: Campagne créée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/projects/{id}/campaigns:
    get:
      summary: "Campagnes d'un projet, filtrables par statut"
      tags:
        - campaigns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          required: false
          schema:
            type: string
          description: "DRAFT, ACTIVE ou DONE"
      responses:
        "200":
          description: Liste des campagnes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignResponse"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/campaigns/{id}/status:
    patch:
      summary: "Changer le statut d'une campagne (ACTIVE publie CampaignLaunched)"
      tags:
        - campaigns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignStatusUpdate"
      responses:
        "200":
          description: Campagne mise à jour
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"
        "400":
          description: Requête invalide
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          description: Non authentifié (JWT absent ou invalide)
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "404":
          description: Ressource introuvable
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: "Conflit avec l'état actuel"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
    CompetitorRequest:
      type: object
      required:
        - projectId
        - name
      properties:
        projectId:
          type: integer
          format: int64
        name:
          type: string
        website:
          type: string
        notes:
          type: string
    CompetitorResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        name:
          type: string
        website:
          type: string
        notes:
          type: string
    WatchEntryRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        sourceUrl:
          type: string
        summary:
          type: string
        observedAt:
          type: string
          format: date
    WatchEntryResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        competitorId:
          type: integer
          format: int64
        title:
          type: string
        sourceUrl:
          type: string
        summary:
          type: string
        observedAt:
          type: string
          format: date
    CampaignRequest:
      type: object
      required:
        - projectId
        - channel
        - objective
      properties:
        projectId:
          type: integer
          format: int64
        channel:
          type: string
          enum:
            - SOCIAL
            - EMAIL
            - EVENT
            - OTHER
        objective:
          type: string
        budget:
          type: number
          example: 500.0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
    CampaignResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        projectId:
          type: integer
          format: int64
        channel:
          type: string
        objective:
          type: string
        budget:
          type: number
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - DONE
    CampaignStatusUpdate:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - DRAFT
            - ACTIVE
            - DONE
